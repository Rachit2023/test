<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM wireframe</title>
<style>
:root{
  --red:#CC0000; --grn:#2E7D52; --ink:#000; --dark:#333331; --g1:#333333; --g2:#5C5C5C; --g3:#858585;
  --g4:#B4B4B4; --g5:#D6D6D6; --g6:#EDEDED; --bg:#F7F7F7; --card:#FFF;
  --line:#D9D9D9; --amber:#F1C21B; --amber-l:#FCF4D6; --teal-l:#E5F6F0;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;
  display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1600px;margin:0 auto;padding:8px 18px 10px;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top{border-top:3px solid var(--red);margin:0;flex:0 0 auto}
.hdr{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 6px;flex:0 0 auto}
.hdr h1{margin:0;font-size:16px;font-weight:700}
.hdr .as{font-size:12px;color:var(--g2)}
/* ---- tabs ---- */
.tabs{display:flex;gap:5px;margin-bottom:7px;flex:0 0 auto}
.tab{font:inherit;font-size:12px;font-weight:700;padding:5px 20px;min-height:28px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.subtabs{display:flex;margin-bottom:7px;width:fit-content;border:1px solid var(--line)}
.subtab{font:inherit;font-size:11px;font-weight:700;padding:4px 24px;min-height:24px;cursor:pointer;
  background:var(--card);border:none;border-right:1px solid var(--line);color:var(--g2)}
.subtab:last-child{border-right:none}
.subtab[aria-selected="true"]{background:var(--dark);color:#fff}
.view{flex:1 1 auto;min-height:0}
.fit{display:flex;flex-direction:column;gap:7px;transform-origin:top left}
.view[hidden]{display:none}
/* ---- ribbon ---- */
.rib{display:grid;gap:6px;margin-bottom:0;flex:0 0 auto}
.rib.c4{grid-template-columns:repeat(4,1fr)} .rib.c3{grid-template-columns:repeat(3,1fr)}
.rib.c2{grid-template-columns:repeat(2,1fr)}
.band{background:var(--card);border:1px solid var(--line)}
.bh{background:var(--dark);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 10px}
.bb{display:flex}
.bx{flex:1;padding:5px 9px;border-right:1px solid var(--line);min-width:0}
.bx:last-child{border-right:none}
.bl{font-size:10.5px;color:var(--g2);display:block}
.bv{font-size:18px;font-weight:700;display:block;margin-top:1px}
.bv small{font-size:12px;font-weight:400;color:var(--g2)}
/* ---- cards ---- */
.row{display:grid;gap:7px;margin-bottom:0;min-height:0}
.row.h2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);padding:7px 10px;
  display:flex;flex-direction:column}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex:0 0 auto}
.ct h2{margin:0;font-size:12.5px;font-weight:700}
.ct .cn{font-size:11px;color:var(--g2)}
.note{font-size:10.5px;color:var(--g2);margin-top:var(--s2)}
.src{font-size:10.5px;color:var(--g2);padding-top:var(--s2)}
/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--g6);text-align:left;font-size:9px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--g1);padding:4px 7px;border:1px solid var(--line);white-space:nowrap}
td{padding:4px 7px;border:1px solid var(--line);font-size:11px}
td.n,th.n{text-align:right}td.c,th.c{text-align:center}
tr:nth-child(even) td{background:#FAFAFA}
tfoot td{font-weight:700;background:var(--g6)!important}
.pn{font-weight:700}
.mut{color:var(--g2)}.red{color:var(--red)}.na{color:var(--g3);font-style:normal}
/* ---- schedule ---- */
.sch{width:100%;border-collapse:collapse;font-size:12px}
.sch th{background:transparent;border:none;color:var(--g2);padding:4px 6px}
.sch td{border:none;padding:3px 6px;vertical-align:middle}
.strow{cursor:pointer}
.strow:hover td{background:#F2F2F2}
.cell{display:block;text-align:center;font-size:10px;padding:4px 0;border:1px solid var(--line)}
.cell.done{background:var(--teal-l);border-color:#9FCFC0;color:var(--g1)}
.cell.cur{background:var(--amber-l);border-color:var(--amber);color:var(--g1)}
.flag{border-left:3px solid var(--red)}
.chip{display:inline-block;font-size:9.5px;padding:1px 8px;border-radius:9px;
  border:1px solid var(--g4);color:var(--g2);margin-right:4px}
.exp{width:16px;text-align:center;font-weight:700;color:var(--g2)}
/* ---- drill-down panel ---- */
.dd{background:#FAFAFA;border:1px solid var(--line);margin:var(--s2) 0 var(--s3)}
.ddh{background:var(--dark);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 12px}
.ddn{font-size:15px;font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.ddb{display:grid;grid-template-columns:repeat(4,1fr);background:#fff}
.ddb>div{padding:8px 12px;border-right:1px solid var(--line)}
.ddb>div:last-child{border-right:none}
.ddg{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);padding:var(--s3) 12px}
.sec{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:var(--s2)}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--g5);font-size:12px}
.kv .k{color:var(--g2)}.kv .v{font-weight:700}
/* ---- charts ---- */
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
.cch{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--g1);margin-bottom:var(--s2)}
.bars{display:flex;align-items:flex-end;gap:var(--s3);height:132px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;height:100%;justify-content:flex-end}
.bwr{position:relative;flex:1;display:flex;align-items:flex-end}
.bar{width:100%;background:var(--g3)}
.bar.hi{background:var(--red)}
.bar.tgt{background:transparent;border:2px dashed var(--g2)}
.bvv{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:700}
.blb{font-size:10px;color:var(--g2);text-align:center;margin-top:5px}
.unit{font-size:10px;color:var(--g2);margin-top:var(--s2)}
/* ---- funnel ---- */
.fw{display:grid;grid-template-columns:1fr 118px;gap:var(--s3);align-items:start;
  container-type:inline-size}
.fr{display:flex;flex-direction:column;justify-content:center;min-height:26px}
.fn{font-size:11px;font-weight:700}.fp{font-size:10.5px;color:var(--g2)}
/* ---- plan vs achieved ---- */
.pv{display:grid;grid-template-columns:38px 1fr;gap:var(--s2);align-items:center;margin-bottom:6px}
.pm{font-size:11px;font-weight:700}
.pl{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;align-items:center;margin-bottom:3px}
.pt{font-size:9px;color:var(--g2)}
.pb{height:9px;background:var(--g3)}.pb.a{background:var(--red)}
.pn2{font-size:11px;font-weight:700;text-align:right}
/* ---- inline bars ---- */
.trk{height:10px;background:var(--g5);position:relative}
.fil{height:10px;background:var(--g3)}.fil.r{background:var(--red)}
.dist{display:flex;height:10px}
.dist span{height:10px}
.lg{display:flex;gap:var(--s4);font-size:10px;color:var(--g2);margin-top:var(--s2);flex-wrap:wrap}
.sw{width:10px;height:10px;display:inline-block;margin-right:4px;vertical-align:-1px}
.tg{font:inherit;font-size:10.5px;font-weight:700;padding:3px 12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.tg[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tgr{display:flex;gap:4px}
@media(max-width:1100px){.row.h2{grid-template-columns:1fr}.rib.c4,.rib.c3{grid-template-columns:1fr 1fr}
  .cc{grid-template-columns:1fr}.ddg{grid-template-columns:1fr}}
/* ───── v2 additions ───── */
.own{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--g6);color:var(--g2);margin-left:6px;letter-spacing:.03em;text-transform:uppercase}
.bx .cmp{font-size:10px;color:var(--g2);display:block;margin-top:1px}
.bx .cmp b{color:var(--ink)}
/* single stacked bar with a target overlay */
.sb{position:relative;height:34px;background:var(--g6);border:1px solid var(--line)}
.sb i{position:absolute;top:0;bottom:0;display:block}
.sb .s1{left:0;background:var(--g3)}
.sb .s2{background:var(--g5)}
.sb .tl{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.sb .tt{position:absolute;top:-19px;font-size:9.5px;font-weight:700;white-space:nowrap;transform:translateX(-50%)}
.sblab{display:flex;justify-content:space-between;font-size:10px;color:var(--g2);margin-top:5px}
.sbwrap{margin-bottom:var(--s4)}
.sbh{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--g1);margin-bottom:16px;display:flex;justify-content:space-between}
.sbh span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--g2)}
/* funnel with ownership bands */
.fnb{display:grid;grid-template-columns:96px 1fr 92px;gap:var(--s2);align-items:center;
  padding:5px 0;border-bottom:1px solid var(--g6)}
.fnb:last-child{border-bottom:none}
.fnn{font-size:11px;font-weight:700}
.fbar{height:20px;background:var(--g3);position:relative}
.fbar .on{position:absolute;left:0;top:0;bottom:0;background:var(--g2)}
.fbar .vv{position:absolute;right:6px;top:2px;font-size:10px;font-weight:700;color:#fff}
.fpc{font-size:10.5px;color:var(--g2);text-align:right}
.oband{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--red);padding:6px 0 2px}
.def{font-size:10px;color:var(--g2);background:var(--g6);padding:6px 9px;margin-bottom:var(--s3);
  border-left:3px solid var(--g4)}
.mece{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:var(--s3)}
.mece>div{background:var(--card);padding:7px 10px}
.mece .l{font-size:10px;color:var(--g2)}
.mece .v{font-size:17px;font-weight:700;display:block;margin-top:1px}
.rem{font-size:11px;color:var(--g2);padding:8px 12px;border-top:1px solid var(--line);background:#fff}
.rem b{color:var(--ink);font-weight:700}
/* ───── v4: match the live deck ───── */
.rem{display:inline-block;font-size:10px;color:var(--g2);border:1px solid var(--line);
  background:var(--g6);padding:3px 10px;margin-top:4px;min-width:340px}
.msdiv{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}
.mslab{position:absolute;font-size:9px;font-weight:700;color:var(--red);white-space:nowrap;
  transform:translateX(-50%);letter-spacing:.03em}
.schwrap{position:relative}
.stgh{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--g2);text-align:center}

.btn{font:inherit;font-size:10px;font-weight:700;padding:3px 12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.btn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.btnr{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ftab{display:flex;gap:6px}
.fband{font-size:9px;font-weight:700;color:var(--red);letter-spacing:.05em;
  text-transform:uppercase;padding:7px 0 3px}
.frow{display:grid;grid-template-columns:96px 1fr 76px 84px;gap:8px;align-items:center;padding:3px 0}
.fnm{font-size:11px;font-weight:700}
.fbar{height:15px;background:var(--g3)}
.fpc{font-size:10px;font-weight:700;text-align:right}
.fbase{font-size:9.5px;color:var(--g2);text-align:right}
.hr1{height:1px;background:var(--g1);margin:4px 0}
.exrow{cursor:pointer}
.exrow td:first-child::before{content:"\203A";display:inline-block;color:var(--red);
  font-weight:700;margin-right:6px}
.exrow[aria-expanded="true"] td:first-child::before{content:"\2039"}
.remrow td{background:var(--g6)!important;font-size:10px;color:var(--g2)}
.actt th{background:var(--red);color:#fff;font-size:11px;text-transform:none;letter-spacing:0;
  text-align:center;padding:9px 8px;border-color:var(--red)}
.actt td{text-align:center;font-weight:700;padding:9px 8px;border-left:none;border-right:none}
.actt td:empty{height:26px}
.mece4{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.mece4>div{border:1px solid var(--line);padding:6px 10px;background:#fff}
.mece4 .l{font-size:10px;color:var(--g2);display:block}
.mece4 .v{font-size:14px;font-weight:700}
.lg2{display:flex;gap:var(--s4);font-size:10px;color:var(--g2);margin:0 0 6px;justify-content:flex-end}
/* ───── lead source mix ───── */
.smx{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;margin-bottom:6px}
.smxl{font-size:9.5px;font-weight:700;color:var(--red);letter-spacing:.05em}
.smxb{display:flex;height:15px}
.smxb span{height:15px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700}
.smxt{font-size:10.5px;font-weight:700;text-align:right}
.smxlg{display:flex;gap:26px;font-size:10px;color:var(--g2);padding-top:6px;
  border-top:1px solid var(--g5);margin-top:4px}
.smxlg b{color:var(--ink)}

/* ───── real dropdown, styled like the red button ───── */
.selw{position:relative;display:inline-block}
.selw::after{content:"\25be";position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:#fff;pointer-events:none;font-size:9px}
.sel{font:inherit;font-size:10px;font-weight:700;padding:3px 22px 3px 12px;cursor:pointer;
  background:var(--red);color:#fff;border:1px solid var(--red);appearance:none;-webkit-appearance:none}
/* ───── collapsible remarks ───── */
.rtog{font:inherit;font-size:9.5px;font-weight:700;color:var(--g2);background:none;border:none;
  cursor:pointer;padding:1px 0;display:inline-flex;align-items:center;gap:4px}
.rtog::before{content:"\25b8";color:var(--red);font-size:9px;transition:none}
.rtog[aria-expanded="true"]::before{content:"\25be"}
.rbody{font-size:10px;color:var(--g2);background:var(--g6);border:1px solid var(--line);
  padding:4px 9px;margin-top:3px}
tr.remrow td{background:var(--g6)!important;font-size:10px;color:var(--g2);padding:5px 9px}
/* scroll only inside a tile if a table is genuinely long */

/* ───── funnel, as on the slide: one ladder, no owner bands ───── */
.fhd{display:flex;justify-content:flex-end;margin-bottom:8px}
.frow2{display:grid;grid-template-columns:88px 1fr 110px;gap:8px;align-items:center;padding:2px 0}
.fbwrap{display:flex;height:14px;align-items:center}
.fb1{background:var(--g2);height:14px;display:block;flex:0 0 auto}
.fval{font-size:9.5px;font-weight:700;color:var(--ink);padding-left:7px;white-space:nowrap}
.mnote{font-size:9.5px;color:var(--g2);margin-top:5px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);
  font-size:10.5px;padding-top:2px}
.mrow span{text-align:center;font-weight:700}
.mlbl{display:block;font-size:9.5px;font-weight:700;color:var(--g2);
  padding-top:5px;border-top:1px solid var(--g5);margin-top:4px}

/* ───── global filter bar ───── */
.gfilt{display:flex;gap:9px;align-items:center;margin-left:auto;background:none}
.gfilt label{font-size:10px;color:var(--g2);font-weight:700;letter-spacing:.03em;background:none}
/* ───── dropdowns: white and clear ───── */
.selw::after{color:var(--g2)}
.sel{background:#fff;color:var(--ink);border:1px solid var(--g4);font-weight:700}
.sel:focus{outline:2px solid var(--red);outline-offset:-1px}
/* ───── project cell ───── */
.pcell{display:flex;flex-direction:column;gap:3px}
.pname{font-size:12px;font-weight:700;line-height:1.2}
.pmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pmeta .chip{margin:0}
/* ───── milestone pillars inside the chevron ───── */
.stgwrap{position:relative}
.pillar{position:absolute;top:-7px;bottom:-1px;width:1px;background:var(--g4);z-index:2}
.pillar::after{content:"";position:absolute;top:-4px;left:-3.5px;width:8px;height:8px;
  background:var(--g2);border:1.5px solid #fff;border-radius:50%;box-sizing:border-box}
.mslabs{position:relative;height:13px}
.mslabs span{position:absolute;font-size:9px;font-weight:700;color:var(--g2);
  white-space:nowrap;transform:translateX(-50%)}

/* ───── hover tooltip ───── */
#tip{position:fixed;top:0;left:0;z-index:99;background:var(--g1);color:#fff;font-size:10.5px;font-weight:700;
  padding:4px 9px;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap}
#tip.on{opacity:1}
[data-tip]{cursor:default}
/* ───── remarks: chevron on the left ───── */
.rtog{font:inherit;font-size:9.5px;font-weight:700;color:var(--g2);background:none;border:none;
  cursor:pointer;padding:1px 0;display:inline-flex;align-items:center;gap:5px}
.rtog::before{content:"\203a";color:var(--g2);font-size:12px;font-weight:700;line-height:1;
  display:inline-block;width:8px}
.rtog[aria-expanded="true"]::before{content:"\2304";font-size:10px}
.rlead{display:inline-flex;align-items:center;gap:6px}

/* ───── YTD target vs achieved ───── */
.ytd{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:#fff;
  flex:0 0 auto}
.ytd>div{padding:6px 12px;border-right:1px solid var(--line)}
.ytd>div:last-child{border-right:none}
.ytdh{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g2)}
.ytdr{display:flex;align-items:baseline;gap:14px;margin-top:2px}
.ytdr b{font-size:15px}
.ytdr span{font-size:10px;color:var(--g2)}
.ytdbar{height:7px;background:var(--g5);margin-top:5px;position:relative}
.ytdbar i{display:block;height:7px;background:var(--g2)}
.ytdbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
/* ───── milestone passed / not passed ───── */
.pillar.done::after{background:var(--grn)}
.mslabs span.done{color:var(--grn)}
/* ───── remarks: chevron only ───── */
.rtog{gap:0;width:14px;justify-content:center}
.mcell{vertical-align:middle;background:#FAFAFA}

/* ───── horizontal progress bar: filled / shortfall / remainder, with a target marker ───── */
.hpwrap{margin-bottom:14px}
.hphd{display:flex;justify-content:space-between;font-size:10px;color:var(--g2);margin-bottom:3px}
.hphd b{font-size:11px;color:var(--ink)}
.hp{position:relative;height:24px;background:var(--g5);border:1px solid var(--g4)}
.hp i{position:absolute;top:0;bottom:0;display:block}
.hp .f1{background:var(--g2)}
.hp .f2{background:var(--red)}
.hp .f3{background:var(--g3)}
.hp .mk{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink);z-index:3}
.hp .mklab{position:absolute;top:-15px;font-size:9px;font-weight:700;white-space:nowrap;
  transform:translateX(-50%);color:var(--ink)}
.hplab{display:flex;justify-content:space-between;font-size:10px;color:var(--g2);margin-top:4px}
.hplab b{color:var(--ink)}
.hpleg{display:flex;gap:16px;font-size:10px;color:var(--g2);margin-top:2px}

.hpnc{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--g3);font-style:normal}

.sub{padding-left:16px;color:var(--g2)}

/* ───── project scheduling: ticks + inline position bars ───── */
.tick{display:inline-block;width:14px;text-align:center;font-weight:700;font-size:12px;color:var(--grn)}
.tick.no{color:var(--g4)}
.posbar{position:relative;height:14px;background:var(--g5);border:1px solid var(--g4)}
.posbar i{position:absolute;top:0;bottom:0;left:0;background:var(--g2)}
.posnum{font-size:9.5px;color:var(--g2);margin-top:2px;display:flex;justify-content:space-between}
.posnum b{color:var(--ink)}
.greyed{opacity:.45}
.tbd{font-size:9.5px;font-weight:700;color:var(--red);margin-left:8px}
/* ───── funnel: svg shape plus a label rail ───── */
.fgrid{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}
.frail{display:flex;flex-direction:column}
.frailrow{display:grid;grid-template-columns:1fr 44px 88px;gap:6px;align-items:center;
  height:30px;font-size:10.5px}
.frailrow .fnm{font-weight:700}
.frailrow .fpc{text-align:right;font-weight:700;font-size:10px}
.frailrow .fbase{text-align:right;font-size:9.5px;color:var(--g2)}
.frailbrk{height:14px}
</style></head>
<body><div class="top"></div><div class="wrap">
  <div class="hdr"><h1>Sales, Marketing &amp; CRM</h1>
    <span class="as">Reporting month &middot; WIREFRAME</span></div>
  <div class="tabs" role="tablist" aria-label="Dashboard sections">
    <button class="tab" role="tab" data-v="ov"  aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-v="mkt" aria-selected="false">Marketing &amp; Pre-sales</button>
    <button class="tab" role="tab" data-v="sal" aria-selected="false">Sales</button>
    <button class="tab" role="tab" data-v="crm" aria-selected="false">CRM</button>
    <button class="tab" role="tab" data-v="act" aria-selected="false">Action items</button>
    <span class="gfilt" id="fbar"></span>
  </div>
  <div class="view" id="v-ov"  role="tabpanel"></div>
  <div class="view" id="v-mkt" role="tabpanel" hidden></div>
  <div class="view" id="v-sal" role="tabpanel" hidden></div>
  <div class="view" id="v-crm" role="tabpanel" hidden></div>
  <div class="view" id="v-act" role="tabpanel" hidden></div>
</div>
<script>
/* ════ SMM wireframe — built from the live deck. Placeholders only. ════ */
const X='XX', XY='Xx', XP='XX%', RS='Rs XX Cr';
const $=s=>document.querySelector(s);

const STAGES=[['Pre-launch','approvals, pricing, not yet on sale'],
              ['Active sales','open for booking'],
              ['Handover','possession offered and taken']];
const MILE=['LAUNCH','POSSESSION / OC'];
const PROJECTS=[
 {id:'p1',name:'Project name',city:'Chennai',biz:'Residential',kind:'bts',cur:2,alert:1,rem:1},
 {id:'p2',name:'Project name',city:'Chennai',biz:'Residential',kind:'bts',cur:1,alert:0,rem:0},
 {id:'p3',name:'Project name',city:'Chennai',biz:'Commercial',kind:'btl',cur:1,alert:1,rem:0}
];

function ribbon(bands){
  return `<div class="rib c${bands.length}">`+bands.map(([t,boxes])=>
    `<div class="band"><div class="bh">${t}</div><div class="bb">`+
    boxes.map(([l,v,s])=>`<div class="bx"><span class="bl">${l}</span>
      <span class="bv">${v}</span>${s?`<span class="cmp">${s}</span>`:''}</div>`).join('')+
    `</div></div>`).join('')+`</div>`;
}
function card(title,note,body,extra){
  return `<div class="card"><div class="ct"><h2>${title}</h2>
    ${extra||(note?`<span class="cn">${note}</span>`:'')}</div>${body}</div>`;
}
function tbl(cols,head,rows,foot,cls){
  return `<table class="${cls||''}"><thead><tr>`+head.map((h,i)=>
      `<th class="${cols[i]||''}">${h}</th>`).join('')+`</tr></thead><tbody>`+
    rows.map(r=>`<tr>`+r.map((c,i)=>`<td class="${cols[i]||''}">${c}</td>`).join('')+`</tr>`).join('')+
    `</tbody>`+(foot?`<tfoot><tr>`+foot.map((c,i)=>`<td class="${cols[i]||''}">${c}</td>`).join('')+`</tr></tfoot>`:'')+
    `</table>`;
}
let RID=0;
function mountTip(){
  if(document.getElementById('tip')) return;
  const t=document.createElement('div'); t.id='tip'; document.body.appendChild(t);
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]');
    if(!el){t.classList.remove('on');return;}
    t.textContent=el.dataset.tip; t.classList.add('on');
  });
  document.addEventListener('mousemove',e=>{
    if(!t.classList.contains('on')) return;
    t.style.left=Math.min(e.clientX+12,window.innerWidth-t.offsetWidth-8)+'px';
    t.style.top=Math.max(e.clientY-30,4)+'px';
  });
}
const tip=s=>` data-tip="${s}"`;
function sel(items,name,active){
  return `<span class="selw"><select class="sel" data-${name}>`+
    items.map((t,i)=>`<option value="${i}"${i===(active||0)?' selected':''}>${t}</option>`).join('')+
    `</select></span>`;
}
/* a row-level remark: arrow toggles the body beneath */
function remark(txt){
  const id='rk'+(++RID);
  return `<button class="rtog" data-rk="${id}" aria-expanded="false" title="Remarks"
      aria-label="Remarks"></button>
    <div class="rbody" id="${id}" hidden>${txt||'remark text'}</div>`;
}
/* a chevron that sits to the LEFT of a row label and reveals a remark row */
function remLead(label,cols,txt){
  const id='rl'+(++RID);
  return {lead:`<span class="rlead"><button class="rtog" data-rk="${id}" aria-expanded="false"
              title="Remarks" aria-label="Remarks"></button>
            <span class="pn">${label}</span></span>`,
          row:`<tr class="remrow" id="${id}" hidden><td colspan="${cols}">${txt||'remark text'}</td></tr>`};
}
function remarkRow(cols,txt){
  const id='rr'+(++RID);
  return {tog:`<button class="rtog" data-rk="${id}" aria-expanded="false"
              title="Remarks" aria-label="Remarks"></button>`,
          row:`<tr class="remrow" id="${id}" hidden><td colspan="${cols}">${txt||'remark text'}</td></tr>`};
}
function wireRemarks(scope){
  (scope||document).querySelectorAll('[data-rk]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const t=document.getElementById(b.dataset.rk), open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',!open);
    if(t.tagName==='TR') t.hidden=open; else t.hidden=open;
  }));
}
function btns(items,active,name){
  return `<span class="btnr">`+items.map((t,i)=>
    `<button class="btn" data-${name}="${i}" aria-pressed="${i===active}">${t}</button>`).join('')+`</span>`;
}
/* four-bar column chart, value above each bar */
function cols4(unit,items,h,mxo){
  const H=h||118, mx=mxo||Math.max(...items.map(i=>i.h));
  return `<div class="bars" style="height:${H}px">`+items.map(i=>{
    const px=Math.max(i.h/mx*(H-26),4);
    return `<div class="bcol"><div class="bwr">
        <span class="bvv" style="bottom:${px+3}px;top:auto">${i.v||X}</span>
        <div class="bar ${i.cls||''}" style="height:${px}px"${tip(i.k+': '+(i.v||X))}></div></div>
      <div class="blb">${i.k}</div></div>`;}).join('')+
    `</div>${unit?`<div class="unit">${unit}</div>`:''}`;
}
/* one horizontal bar: filled, shortfall to target in red, remainder light */
function hprog(o){
  const f=o.fill, t=o.target, sf=Math.max(0,t-f);
  if(o.nc) return `<div class="hpwrap">
    <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
    <div class="hp"><span class="hpnc">not captured</span></div>
    <div class="hplab"><span>${o.n1} <span class="na">n/c</span></span>
      <span>${o.n4} <span class="na">n/c</span></span>
      <span>${o.n5} <span class="na">n/c</span></span></div></div>`;
  const mid=o.mid;
  const body = (mid!==undefined)
    ? `<i class="f1" style="left:0;width:${f}%"${tip(o.n1+': '+X)}></i>
       <i class="f3" style="left:${f}%;width:${mid-f}%"${tip(o.nMid+': '+X)}></i>
       <i style="left:${mid}%;width:${100-mid}%;background:var(--g5)"${tip(o.n3+': '+X)}></i>`
    : `<i class="f1" style="left:0;width:${f}%"${tip(o.n1+': '+X)}></i>
       ${sf>0?`<i class="f2" style="left:${f}%;width:${sf}%"${tip(o.n2+': '+X)}></i>`:''}
       <i style="left:${t}%;width:${100-t}%;background:var(--g5)"${tip(o.n3+': '+X)}></i>`;
  const midLab = (mid!==undefined) ? `<span>${o.nMid} <b>${X}</b></span>`
                                   : `<span>${o.n2} <b>${X}</b></span>`;
  return `<div class="hpwrap">
    <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
    <div class="hp">${body}
      <span class="mk" style="left:${t}%"></span>
      <span class="mklab" style="left:${t}%">${o.n4} ${X}</span>
    </div>
    <div class="hplab"><span>${o.n1} <b>${X}</b></span>
      ${midLab}
      <span>${o.n5} <b>${X}</b></span></div></div>`;
}

/* one bar, sold dark / unsold light, target tick */
function hbar(lab,soldPct,tgtPct){
  return `<div style="display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;margin-bottom:14px">
    <span style="font-size:11px;font-weight:700">${lab}</span>
    <div><div class="sb">
        <i class="s1" style="width:${soldPct}%"${tip('Sold: '+X)}></i>
        <i class="s2" style="left:${soldPct}%;width:${100-soldPct}%"${tip('Unsold: '+X)}></i>
        ${tgtPct?`<span class="tl" style="left:${tgtPct}%"></span>`:''}
      </div>
      <div class="sblab"><span>sold ${X}</span><span>unsold ${X}</span><span>total ${X}</span></div>
    </div></div>`;
}

function srcMix(){
  const SEG=[['Direct',52,34,'var(--g2)','#fff'],
             ['Referral',36,46,'var(--g3)','#fff'],
             ['Channel partner',12,20,'var(--g5)','var(--g1)']];
  const row=(lab,idx)=>`<div class="smx">
      <span class="smxl">${lab}</span>
      <div class="smxb">`+SEG.map(g=>
        `<span style="width:${g[idx]}%;background:${g[3]};color:${g[4]}"${tip(g[0]+' '+(idx===1?'leads':'bookings')+': '+X+' ('+XP+')')}>${X}</span>`).join('')+
      `</div><span class="smxt">total ${X}</span></div>`;
  return card('Lead source mix',
    'same three segments on both rows &middot; the gap between them is the conversion story',
    row('LEADS',1)+row('BOOKINGS',2)+
    `<div class="smxlg">`+SEG.map(g=>
      `<span><i class="sw" style="background:${g[3]}"></i>${g[0]} <b>${X}</b> (${XP})</span>`).join('')+
    `</div>`);
}

/* ══════════ 1 · OVERVIEW ══════════ */
let OPEN=null, OVSCOPE=0, POSUNIT=0;
const UNITS=['Units','Value (Rs Cr)','Area (sq ft)'];
const STG=['Pre-sales','Active sales','Construction'];

function rOverview(){
  setTimeout(fitView,0);
  const rib=ribbon([
    ['Marketing &amp; Pre-sales',[['Lead to site visit conversion',XP,'%'],['Visit to sale',XP,'%']]],
    ['Sales &mdash; Residential',[['Unsold stock value',RS,''],['Absorption rate',X,'units / month']]],
    ['Sales &mdash; Commercial',[['Vacant area',X,'sq ft'],['Expiring in 12 months',X,'sq ft']]],
    ['CRM',[['CSAT/NPS score','X/XX','score, 0 to 10'],['Collections',XP,'% of demand raised']]]]);

  /* YTD: build to sell in value, build to lease in area */
  const ytd=`<div class="ytd">`+
    [['Build to sell','Rs '+X+' Cr',0.62],['Build to lease',X+' Mn sq ft',0.78]].map(([t,v,f])=>`
      <div><span class="ytdh">YTD sales target vs achieved &mdash; ${t}</span>
        <div class="ytdr"><b>${v}</b><span>achieved</span>
          <b>${v}</b><span>target</span><b>${XP}</b><span>of target</span></div>
        <div class="ytdbar"${tip(t+' \u2014 achieved '+v+' of '+v+' target')}>
          <i style="width:${f*100}%"></i><u style="left:100%"></u></div></div>`).join('')+
    `</div>`;

  /* scheduling: stage ticks, then position and handover as inline bars */
  const rows=PROJECTS.map((p,pi)=>{
    const ticks=STG.map((_,i)=>`<span class="tick${i<=p.cur?'':' no'}"
        ${tip(STG[i]+(i<=p.cur?': done':': not started'))}>${i<=p.cur?'\u2713':'\u2013'}</span>`).join('');
    const soldPct=[74,52,38][pi], hoPct=[62,0,0][pi];
    return `<tr class="strow" data-dd="${p.id}">
      <td><span class="rlead">${remark('one line from the project owner')}
        <span class="pn">${p.name}</span></span><br>
        <span class="chip">${p.city}</span><span class="chip">${p.biz}</span></td>
      <td class="c">${ticks}</td>
      <td><div class="posbar"${tip('Sold '+soldPct+'% of total')}><i style="width:${soldPct}%"></i></div>
        <div class="posnum"><span>total <b>${X}</b></span><span>sold <b>${X}</b></span>
          <span>remaining <b>${X}</b></span><span>sold <b>${XP}</b></span></div></td>
      <td><div class="posbar"${tip('Handed over '+hoPct+'% of sold')}><i style="width:${hoPct}%"></i></div>
        <div class="posnum"><span>handed over <b>${X}</b></span><span>left <b>${X}</b></span></div></td>
      <td class="c exp" id="ex-${p.id}">+</td></tr>
      <tr id="dr-${p.id}" hidden><td colspan="5" style="padding:0"></td></tr>`;
  }).join('');

  const sch=`<table><thead><tr>
      <th style="width:210px">Project</th>
      <th class="c" style="width:150px">${STG.join(' &middot; ')}</th>
      <th>Sales position</th><th style="width:230px">Handover</th>
      <th style="width:22px"></th></tr></thead><tbody>${rows}</tbody></table>`;

  $('#v-ov').innerHTML=ytd+rib+srcMix()+
    card('Project scheduling','',sch,
      `<span style="display:flex;gap:8px;align-items:center">
         ${sel(UNITS,'posu',POSUNIT)}${sel(['Overall view'].concat(PROJECTS.map((p,i)=>'Project '+(i+1))),'ovs',OVSCOPE)}</span>`);
  wireRemarks($('#v-ov'));
  const os=$('[data-ovs]'); if(os) os.addEventListener('change',()=>{OVSCOPE=+os.value;rOverview();});
  const pu=$('[data-posu]'); if(pu) pu.addEventListener('change',()=>{POSUNIT=+pu.value;rOverview();});
  let lastHit=0, lastId='';
  document.querySelectorAll('[data-dd]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.dd, now=Date.now();
    if(id===lastId && now-lastHit<350){ lastHit=now; return; }
    lastHit=now; lastId=id;
    if(OPEN&&OPEN!==id){$('#dr-'+OPEN).hidden=true;$('#dr-'+OPEN).firstElementChild.innerHTML='';$('#ex-'+OPEN).textContent='+';}
    const dr=$('#dr-'+id), open=!dr.hidden;
    dr.hidden=open; $('#ex-'+id).textContent=open?'+':'\u2212';
    if(!open){dr.firstElementChild.innerHTML=panel(PROJECTS.find(p=>p.id===id));OPEN=id;}
    else{dr.firstElementChild.innerHTML='';OPEN=null;}
    fitView();
  }));
}

/* ══════════ 5 · ACTION ITEMS ══════════ */
function rAct(){
  setTimeout(fitView,0);
  $('#v-act').innerHTML=card('Action items from previous meetings','',
    tbl(['','','c','c','c',''],['Project','Action','Owner (s)','Timeline','Status','Remarks'],
      [1,2,3,4,5,6,7,8].map(()=>[X,X,X,X,X,X]),null,'actt'));
}

function panel(p){
  const kv=r=>r.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const bts=p.kind==='bts';
  const boxes=bts
    ? [['Sold value','Rs '+X+' Cr'],['Unsold value','Rs '+X+' Cr'],['SBA',X+' sq.ft'],['Avg price/sq ft','Rs '+X]]
    : [['Let',XP],['Area to lease',X+' sq.ft'],['SBA',X+' sq.ft'],['Avg price/sq ft','Rs '+X]];
  const left=bts
    ? [['Total area',X+' sq.ft'],['Sold area',X+' sq.ft'],['Unsold area',X+' sq.ft'],['Unsold stock value','Rs '+X+' Cr']]
    : [['Total area',X+' sq.ft'],['Leased area',X+' sq.ft'],['Available area',X+' sq.ft'],['Rent at risk','Rs '+X+' Cr']];
  const right=bts
    ? [['Micro-market','text'],['Total units',X],['Configuration','text'],['Launch date','date']]
    : [['Micro-market','text'],['Asset type','text'],['Type of let out','text'],['Launch date','date']];
  return `<div class="dd">
    <div class="ddh">${bts?'Build to sell':'Build to lease'}</div>
    <div class="ddn">${p.name}</div>
    <div class="ddb">`+boxes.map(([l,v])=>
      `<div><span class="bl">${l}</span><span class="bv">${v}</span></div>`).join('')+`</div>
    <div class="ddg">
      <div><div class="sec">Position</div>${kv(left)}</div>
      <div><div class="sec">Project profile</div>${kv(right)}</div></div></div>`;
}

/* ══════════ 2 · MARKETING & PRE-SALES ══════════ */
let FMODE=0;
function rMkt(){
  setTimeout(fitView,0);
  const rib=ribbon([
    ['Spend',[['Spend','Rs '+XY+' Cr','XX% of yearly budget'],
              ['Spend as % of sales value','Xx %','% of sales value &middot; target Xx%']]],
    ['Efficiency',[['Cost per lead','Rs '+XY,''],
                   ['Cost per booking','Rs '+XY,'']]]]);

  const ONLINE=[['Ad views',100,''],['Clicks',72,'XX% of views'],['Leads',46,'XX% of clicks'],
                ['Contacted',40,'XX% of leads'],['Qualified',30,'XX% of leads'],
                ['Site visits',18,'XX% of qualified'],['Booked',5,'XX% of site visits']];
  const OFFLINE=[['Contacts made',100,''],['Leads',58,'XX% of contacts'],
                 ['Contacted',48,'XX% of leads'],['Qualified',34,'XX% of leads'],
                 ['Site visits',20,'XX% of qualified'],['Booked',7,'XX% of site visits']];
  const F=FMODE?OFFLINE:ONLINE;
  /* a real funnel: trapezoids, with an axis break where the scale jumps */
  const BRK=FMODE?1:2;          /* rows above the break are drawn on a compressed scale */
  const W0=300, BH=30, GAPB=16, SVGH=F.length*BH+GAPB;
  const wide=F.slice(0,BRK).map((r,i)=>W0*0.94-i*W0*0.09);
  const narrow=F.slice(BRK).map(r=>Math.max(W0*r[1]/100*0.60,W0*0.06));
  const widths=wide.concat(narrow);
  let svg=`<svg viewBox="0 0 ${W0} ${SVGH}" width="100%" height="${SVGH}"
    preserveAspectRatio="xMidYMid meet" style="max-height:${SVGH}px" role="img"
    aria-label="funnel, all values XX">`;
  let yv=0;
  widths.forEach((w,i)=>{
    if(i===BRK){
      svg+=`<path d="M0 ${yv+3} L${W0} ${yv+3}" stroke="#B4B4B4" stroke-width="1"
              stroke-dasharray="5 4" fill="none"/>
            <path d="M${W0/2-20} ${yv+10} l6 -6 l6 6 l6 -6 l6 6" stroke="#5C5C5C"
              stroke-width="1.2" fill="none"/>
            <text x="4" y="${yv+12}" font-family="Arial" font-size="8"
              fill="#858585">scale break</text>`;
      yv+=GAPB;
    }
    const nw=widths[i+1]!==undefined?widths[i+1]:w*0.72;
    svg+=`<polygon points="${(W0-w)/2},${yv} ${(W0+w)/2},${yv} ${(W0+nw)/2},${yv+BH-3} ${(W0-nw)/2},${yv+BH-3}"
        fill="#5C5C5C"><title>${F[i][0]}: XX</title></polygon>
      <text x="${W0/2}" y="${yv+BH/2}" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">XX</text>`;
    yv+=BH;
  });
  svg+=`</svg>`;
  const rail=`<div class="frail">`+F.map(([n,w,base],i)=>
      `${i===BRK?`<div class="frailbrk"></div>`:''}
       <div class="frailrow"><span class="fnm">${n}</span>
         <span class="fpc">${XP}</span><span class="fbase">${base||'\u2014'}</span></div>`).join('')+
    `</div>`;
  const funnel=card('','',
    `<div class="fhd">${btns(['Online','Offline'],FMODE,'fm')}</div>
     <div class="fband">MARKETING</div>
     <div class="fgrid">${svg}${rail}</div>`);

  const mom=card('Month by month, enquiries by outcome','',
    `<div class="lg2"><span><i class="sw" style="background:var(--g3)"></i>Leads</span>
      <span><i class="sw" style="background:var(--g1)"></i>Visits</span>
      <span><i class="sw" style="background:var(--red)"></i>Booked</span></div>`+
    `<div class="bars" style="height:112px">`+['Mar','Apr','May','Jun'].map((m,i)=>{
      const px=[92,78,70,64][i], last=(i===3);
      return `<div class="bcol"><div class="bwr">
        <span class="bvv" style="bottom:${px+3}px;top:auto">${X}</span><div style="width:100%">`+
        (last?`<div class="bar" style="height:${px*0.34}px"${tip('Leads: '+X)}></div>
               <div class="bar" style="height:${px*0.34}px;background:var(--g1)"${tip('Visits: '+X)}></div>
               <div class="bar hi" style="height:${px*0.32}px"${tip('Booked: '+X)}></div>`
             :`<div class="bar" style="height:${px}px"${tip(m+' leads: '+X)}></div>`)+
        `</div></div><div class="blb">${m}</div></div>`;}).join('')+`</div>`+
    tbl(['','c','c','c','c'],['Measure','Mar','Apr','May','Jun'],
      [['Lead to site visit conversion',XP,XP,XP,XP]]));

  const av=card('Cost by avenue','',
    tbl(['','c','c','c','c','c'],
      ['Avenue','Channel','Leads','Qualified','Cost / lead','Cost / booking'],
      [['Meta/Instagram','Online',X,X,'Rs '+X,'Rs '+X],
       ['Google search','Online',X,X,'Rs '+X,'Rs '+X],
       ['Portals','Online',X,X,'Rs '+X,'Rs '+X],
       ['Channel partner','Offline',X,X,'Rs '+X,'Rs '+X],
       ['Referral','Offline',X,X,'Rs '+X,'Rs '+X],
       ['<b>Total</b>','',X,X,'Rs '+X,'Rs '+X]]));

  const ps=card('Pre-sales discipline <span class="tbd">To be populated later</span>','',

/* ══════════ global filters ══════════ */
function mountFilters(){
  const bar=document.getElementById('fbar');
  bar.innerHTML=`<label for="f-asset">Asset type</label>
    ${sel(['All','Residential','Commercial'],'fasset',0).replace('<select','<select id="f-asset"')}
    <label for="f-region">Region</label>
    ${sel(['All','Chennai','Kolkata'],'fregion',0).replace('<select','<select id="f-region"')}`;
  bar.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{
    Object.keys(DONE).forEach(k=>delete DONE[k]);
    const cur=[...document.querySelectorAll('.tab')].find(t=>t.getAttribute('aria-selected')==='true');
    show(cur?cur.dataset.v:'ov');
  }));
}

/* ══════════ tabs ══════════ */
const R={ov:rOverview,mkt:rMkt,sal:rSales,crm:rCRM,act:rAct}, DONE={};
/* scale the rendered view so it always fits the viewport - no page scroll, no clipping */
function fitView(){
  document.querySelectorAll('.view').forEach(v=>{
    if(v.hidden) return;
    let f=v.querySelector(':scope > .fit');
    if(!f){ f=document.createElement('div'); f.className='fit';
      while(v.firstChild) f.appendChild(v.firstChild); v.appendChild(f); }
    f.style.transform='none'; f.style.width='100%';
    const avail=v.clientHeight, nat=f.scrollHeight;
    /* only nudge for a small overflow; a big one (zoomed in) is left to scroll */
    if(nat>avail && nat>0 && avail/nat>=0.85){
      const s=avail/nat;
      f.style.transform=`scale(${s})`; f.style.width=(100/s)+'%';
    }
  });
}
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.hidden=(x.id!=='v-'+v));
  if(!DONE[v]){R[v]();DONE[v]=true;}
  requestAnimationFrame(fitView);
}
window.addEventListener('resize',()=>requestAnimationFrame(fitView));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
mountFilters();
mountTip();
show('ov');
