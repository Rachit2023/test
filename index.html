<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM wireframe</title>
<style>
:root{
  --red:#CC0000; --grn:#2E7D52; --ink:#000; --dark:#333331; --g1:#333333; --g2:#5C5C5C; --g3:#858585;
  --g4:#B4B4B4; --g5:#D6D6D6; --g6:#EDEDED; --bg:#F7F7F7; --card:#FFF;
  --line:#D9D9D9; --amber:#F1C21B; --amber-l:#FCF4D6; --teal-l:#E5F6F0;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;font-size:15.6px;line-height:1.4;
  display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1600px;margin:0 auto;padding:8px 18px 10px;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top{border-top:3px solid var(--red);margin:0;flex:0 0 auto}
.hdr{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 6px;flex:0 0 auto}
.hdr h1{margin:0;font-size:19.2px;font-weight:700}
.hdr .as{font-size:14.4px;color:var(--g2)}
/* ---- tabs ---- */
.tabs{display:flex;gap:5px;margin-bottom:7px;flex:0 0 auto}
.tab{font:inherit;font-size:14.4px;font-weight:700;padding:6px 18px;min-height:32px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.subtabs{display:flex;margin-bottom:7px;width:fit-content;border:1px solid var(--line)}
.subtab{font:inherit;font-size:13.2px;font-weight:700;padding:5px 22px;min-height:28px;cursor:pointer;
  background:var(--card);border:none;border-right:1px solid var(--line);color:var(--g2)}
.subtab:last-child{border-right:none}
.subtab[aria-selected="true"]{background:var(--dark);color:#fff}
.view{flex:1 1 auto;min-height:0}
.fit{display:flex;flex-direction:column;gap:7px;transform-origin:top left}
.view[hidden]{display:none}
/* ---- ribbon ---- */
.rib{display:grid;gap:6px;margin-bottom:0;flex:0 0 auto}
.rib.c5{grid-template-columns:repeat(5,1fr)}
.rib.c4{grid-template-columns:repeat(4,1fr)} .rib.c3{grid-template-columns:repeat(3,1fr)}
.rib.c2{grid-template-columns:repeat(2,1fr)}
.band{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.bh{background:var(--dark);color:#fff;font-size:12.0px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 10px;flex:0 0 auto}
.bb{display:flex;flex:1 1 auto;align-items:stretch}
.bx{flex:1 1 0;padding:5px 9px;border-right:1px solid var(--line);min-width:0;
  display:flex;flex-direction:column}
.bx:last-child{border-right:none}
/* the label takes the slack, so every value sits on the same baseline across bands */
.bl{font-size:12.6px;color:var(--g2);display:block;flex:1 1 auto}
.bv{font-size:21.6px;font-weight:700;display:block;margin-top:1px}
.bv small{font-size:14.4px;font-weight:400;color:var(--g2)}
/* five bands, ten boxes: tighten type and lock the header to one line so every
   band body starts and ends at the same height */
.rib.c5 .bh{font-size:11.4px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rib.c5 .bx{padding:5px 8px}
.rib.c5 .bl{font-size:11.4px;line-height:1.25;min-height:2.5em}
.rib.c5 .bv{font-size:18.0px}
/* the sub-line reserves two lines whether it wraps or not, so a long unit in one
   box cannot push its value off the baseline the other nine sit on */
.rib.c5 .cmp{font-size:11.4px;line-height:1.2;min-height:2.4em}
/* ---- cards ---- */
.row{display:grid;gap:7px;margin-bottom:0;min-height:0}
.row.h2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);padding:7px 10px;
  display:flex;flex-direction:column}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex:0 0 auto}
.ct h2{margin:0;font-size:15.0px;font-weight:700}
.ct .cn{font-size:13.2px;color:var(--g2)}
.note{font-size:12.6px;color:var(--g2);margin-top:var(--s2)}
.src{font-size:12.6px;color:var(--g2);padding-top:var(--s2)}
/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:14.4px}
th{background:var(--g6);text-align:left;font-size:10.8px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--g1);padding:5px 8px;border:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border:1px solid var(--line);font-size:13.2px}
td.n,th.n{text-align:right}td.c,th.c{text-align:center}
tr:nth-child(even) td{background:#FAFAFA}
tfoot td{font-weight:700;background:var(--g6)!important}
.pn{font-weight:700}
.mut{color:var(--g2)}.red{color:var(--red)}.na{color:var(--g3);font-style:normal}
/* ---- schedule ---- */
.sch{width:100%;border-collapse:collapse;font-size:14.4px}
.sch th{background:transparent;border:none;color:var(--g2);padding:4px 6px}
.sch td{border:none;padding:3px 6px;vertical-align:middle}
.strow{cursor:pointer}
.strow:hover td{background:#F2F2F2}
.cell{display:block;text-align:center;font-size:12.0px;padding:4px 0;border:1px solid var(--line)}
.cell.done{background:var(--teal-l);border-color:#9FCFC0;color:var(--g1)}
.cell.cur{background:var(--amber-l);border-color:var(--amber);color:var(--g1)}
.flag{border-left:3px solid var(--red)}
.chip{display:inline-block;font-size:11.4px;padding:1px 8px;border-radius:9px;
  border:1px solid var(--g4);color:var(--g2);margin-right:4px}
.exp{width:16px;text-align:center;font-weight:700;color:var(--g2)}
/* ---- drill-down panel ---- */
.dd{background:#FAFAFA;border:1px solid var(--line);margin:var(--s2) 0 var(--s3)}
.ddh{background:var(--dark);color:#fff;font-size:12.0px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 12px}
.ddn{font-size:18.0px;font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.ddb{display:grid;grid-template-columns:repeat(4,1fr);background:#fff}
.ddb>div{padding:8px 12px;border-right:1px solid var(--line)}
.ddb>div:last-child{border-right:none}
.ddg{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);padding:var(--s3) 12px}
.sec{font-size:12.0px;font-weight:700;color:var(--red);letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:var(--s2)}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--g5);font-size:14.4px}
.kv .k{color:var(--g2)}.kv .v{font-weight:700}
/* ---- charts ---- */
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
.cch{font-size:12.0px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--g1);margin-bottom:var(--s2)}
.bars{display:flex;align-items:flex-end;gap:var(--s3);height:132px;padding-top:28px}
.bcol{flex:1;display:flex;flex-direction:column;height:100%;justify-content:flex-end}
.bwr{position:relative;flex:1;display:flex;align-items:flex-end}
.bar{width:100%;background:var(--g3)}
.bar.hi{background:var(--red)}
.bar.tgt{background:transparent;border:2px dashed var(--g2)}
.bvv{position:absolute;left:0;right:0;text-align:center;font-size:13.2px;font-weight:700}
.blb{font-size:12.0px;color:var(--g2);text-align:center;margin-top:5px}
.unit{font-size:12.0px;color:var(--g2);margin-top:var(--s2)}
/* ---- funnel ---- */
.fw{display:grid;grid-template-columns:1fr 118px;gap:var(--s3);align-items:start;
  container-type:inline-size}
.fr{display:flex;flex-direction:column;justify-content:center;min-height:26px}
.fn{font-size:13.2px;font-weight:700}.fp{font-size:12.6px;color:var(--g2)}
/* ---- plan vs achieved ---- */
.pv{display:grid;grid-template-columns:38px 1fr;gap:var(--s2);align-items:center;margin-bottom:6px}
.pm{font-size:13.2px;font-weight:700}
.pl{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;align-items:center;margin-bottom:3px}
.pt{font-size:10.8px;color:var(--g2)}
.pb{height:9px;background:var(--g3)}.pb.a{background:var(--red)}
.pn2{font-size:13.2px;font-weight:700;text-align:right}
/* ---- inline bars ---- */
.trk{height:10px;background:var(--g5);position:relative}
.fil{height:10px;background:var(--g3)}.fil.r{background:var(--red)}
.dist{display:flex;height:10px}
.dist span{height:10px}
.lg{display:flex;gap:var(--s4);font-size:12.0px;color:var(--g2);margin-top:var(--s2);flex-wrap:wrap}
.sw{width:10px;height:10px;display:inline-block;margin-right:4px;vertical-align:-1px}
.tg{font:inherit;font-size:12.6px;font-weight:700;padding:3px 12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.tg[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tgr{display:flex;gap:4px}
@media(max-width:1100px){.row.h2{grid-template-columns:1fr}.rib.c4,.rib.c3{grid-template-columns:1fr 1fr}
  .rib.c5{grid-template-columns:repeat(3,1fr)}
  .rib.c5 .bh{white-space:normal}
  .cc{grid-template-columns:1fr}.ddg{grid-template-columns:1fr}}
/* ───── v2 additions ───── */
.own{display:inline-block;font-size:10.8px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--g6);color:var(--g2);margin-left:6px;letter-spacing:.03em;text-transform:uppercase}
.bx .cmp{font-size:12.0px;color:var(--g2);display:block;margin-top:1px}
.bx .cmp b{color:var(--ink)}
/* single stacked bar with a target overlay */
.sb{position:relative;height:34px;background:var(--g6);border:1px solid var(--line)}
.sb i{position:absolute;top:0;bottom:0;display:block}
.sb .s1{left:0;background:var(--g3)}
.sb .s2{background:var(--g5)}
.sb .tl{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.sb .tt{position:absolute;top:-19px;font-size:11.4px;font-weight:700;white-space:nowrap;transform:translateX(-50%)}
.sblab{display:flex;justify-content:space-between;font-size:12.0px;color:var(--g2);margin-top:5px}
.sbwrap{margin-bottom:var(--s4)}
.sbh{font-size:12.0px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--g1);margin-bottom:16px;display:flex;justify-content:space-between}
.sbh span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--g2)}
/* funnel with ownership bands */
.fnb{display:grid;grid-template-columns:96px 1fr 92px;gap:var(--s2);align-items:center;
  padding:5px 0;border-bottom:1px solid var(--g6)}
.fnb:last-child{border-bottom:none}
.fnn{font-size:13.2px;font-weight:700}
.fbar{height:20px;background:var(--g3);position:relative}
.fbar .on{position:absolute;left:0;top:0;bottom:0;background:var(--g2)}
.fbar .vv{position:absolute;right:6px;top:2px;font-size:12.0px;font-weight:700;color:#fff}
.fpc{font-size:12.6px;color:var(--g2);text-align:right}
.oband{font-size:10.8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--red);padding:6px 0 2px}
.def{font-size:12.0px;color:var(--g2);background:var(--g6);padding:6px 9px;margin-bottom:var(--s3);
  border-left:3px solid var(--g4)}
.mece{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:var(--s3)}
.mece>div{background:var(--card);padding:7px 10px}
.mece .l{font-size:12.0px;color:var(--g2)}
.mece .v{font-size:20.4px;font-weight:700;display:block;margin-top:1px}
.rem{font-size:13.2px;color:var(--g2);padding:8px 12px;border-top:1px solid var(--line);background:#fff}
.rem b{color:var(--ink);font-weight:700}
/* ───── v4: match the live deck ───── */
.rem{display:inline-block;font-size:12.0px;color:var(--g2);border:1px solid var(--line);
  background:var(--g6);padding:3px 10px;margin-top:4px;min-width:340px}
.msdiv{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}
.mslab{position:absolute;font-size:10.8px;font-weight:700;color:var(--red);white-space:nowrap;
  transform:translateX(-50%);letter-spacing:.03em}
.schwrap{position:relative}
.stgh{font-size:11.4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--g2);text-align:center}

.btn{font:inherit;font-size:12.0px;font-weight:700;padding:3px 12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--g2)}
.btn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.btnr{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ftab{display:flex;gap:6px}
.fband{font-size:10.8px;font-weight:700;color:var(--red);letter-spacing:.05em;
  text-transform:uppercase;padding:7px 0 3px}
.frow{display:grid;grid-template-columns:96px 1fr 76px 84px;gap:8px;align-items:center;padding:3px 0}
.fnm{font-size:13.2px;font-weight:700}
.fbar{height:15px;background:var(--g3)}
.fpc{font-size:12.0px;font-weight:700;text-align:right}
.fbase{font-size:11.4px;color:var(--g2);text-align:right}
.hr1{height:1px;background:var(--g1);margin:4px 0}
.exrow{cursor:pointer}
.exrow td:first-child::before{content:"\203A";display:inline-block;color:var(--red);
  font-weight:700;margin-right:6px}
.exrow[aria-expanded="true"] td:first-child::before{content:"\2039"}
.remrow td{background:var(--g6)!important;font-size:12.0px;color:var(--g2)}
.actt th{background:var(--red);color:#fff;font-size:13.2px;text-transform:none;letter-spacing:0;
  text-align:center;padding:9px 8px;border-color:var(--red)}
.actt td{text-align:center;font-weight:700;padding:9px 8px;border-left:none;border-right:none}
.actt td:empty{height:26px}
.mece4{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.mece4>div{border:1px solid var(--line);padding:6px 10px;background:#fff}
.mece4 .l{font-size:12.0px;color:var(--g2);display:block}
.mece4 .v{font-size:16.8px;font-weight:700}
.lg2{display:flex;gap:var(--s4);font-size:12.0px;color:var(--g2);margin:0 0 6px;justify-content:flex-end}
/* ───── lead source mix ───── */
.smx{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;margin-bottom:6px}
.smxl{font-size:11.4px;font-weight:700;color:var(--red);letter-spacing:.05em}
.smxb{display:flex;height:15px}
.smxb span{height:15px;display:flex;align-items:center;justify-content:center;
  font-size:11.4px;font-weight:700}
.smxt{font-size:12.6px;font-weight:700;text-align:right}
.smxlg{display:flex;gap:26px;font-size:12.0px;color:var(--g2);padding-top:6px;
  border-top:1px solid var(--g5);margin-top:4px}
.smxlg b{color:var(--ink)}

/* ───── real dropdown, styled like the red button ───── */
.selw{position:relative;display:inline-block}
.selw::after{content:"\25be";position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:#fff;pointer-events:none;font-size:10.8px}
.sel{font:inherit;font-size:12.0px;font-weight:700;padding:3px 22px 3px 12px;cursor:pointer;
  background:var(--red);color:#fff;border:1px solid var(--red);appearance:none;-webkit-appearance:none}
/* ───── collapsible remarks ───── */
.rtog{font:inherit;font-size:11.4px;font-weight:700;color:var(--g2);background:none;border:none;
  cursor:pointer;padding:1px 0;display:inline-flex;align-items:center;gap:4px}
.rtog::before{content:"\25b8";color:var(--red);font-size:10.8px;transition:none}
.rtog[aria-expanded="true"]::before{content:"\25be"}
.rbody{font-size:12.0px;color:var(--g2);background:var(--g6);border:1px solid var(--line);
  padding:4px 10px;margin-top:5px;min-width:280px}
.rbody[hidden]{display:none}
tr.remrow td{background:var(--g6)!important;font-size:12.0px;color:var(--g2);padding:5px 9px}
/* scroll only inside a tile if a table is genuinely long */

/* ───── funnel, as on the slide: one ladder, no owner bands ───── */
.fhd{display:flex;justify-content:flex-end;margin-bottom:8px}
.frow2{display:grid;grid-template-columns:100px 1fr 124px;gap:8px;align-items:center;padding:2px 0}
.fbwrap{display:flex;height:14px;align-items:center}
.fb1{background:var(--g2);height:14px;display:block;flex:0 0 auto}
.fval{font-size:11.4px;font-weight:700;color:var(--ink);padding-left:7px;white-space:nowrap}
.mnote{font-size:11.4px;color:var(--g2);margin-top:5px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);
  font-size:12.6px;padding-top:2px}
.mrow span{text-align:center;font-weight:700}
.mlbl{display:block;font-size:11.4px;font-weight:700;color:var(--g2);
  padding-top:5px;border-top:1px solid var(--g5);margin-top:4px}

/* ───── global filter bar ───── */
.gfilt{display:flex;gap:9px;align-items:center;margin-left:auto;background:none}
.gfilt label{font-size:12.0px;color:var(--g2);font-weight:700;letter-spacing:.03em;background:none}
/* ───── dropdowns: white and clear ───── */
.selw::after{color:var(--g2)}
.sel{background:#fff;color:var(--ink);border:1px solid var(--g4);font-weight:700}
.sel:focus{outline:2px solid var(--red);outline-offset:-1px}
/* ───── project cell ───── */
.pcell{display:flex;flex-direction:column;gap:3px}
.pname{font-size:14.4px;font-weight:700;line-height:1.2}
.pmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pmeta .chip{margin:0}
/* ───── milestone pillars inside the chevron ───── */
.stgwrap{position:relative}
.pillar{position:absolute;top:-7px;bottom:-1px;width:1px;background:var(--g4);z-index:2}
.pillar::after{content:"";position:absolute;top:-4px;left:-3.5px;width:8px;height:8px;
  background:var(--g2);border:1.5px solid #fff;border-radius:50%;box-sizing:border-box}
.mslabs{position:relative;height:13px}
.mslabs span{position:absolute;font-size:10.8px;font-weight:700;color:var(--g2);
  white-space:nowrap;transform:translateX(-50%)}

/* ───── hover tooltip ───── */
#tip{position:fixed;top:0;left:0;z-index:99;background:var(--g1);color:#fff;font-size:12.6px;font-weight:700;
  padding:4px 9px;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap}
#tip.on{opacity:1}
[data-tip]{cursor:default}
/* ───── remarks: chevron on the left ───── */
.rtog{font:inherit;font-size:11.4px;font-weight:700;color:var(--g2);background:none;border:none;
  cursor:pointer;padding:1px 0;display:inline-flex;align-items:center;gap:5px}
.rtog::before{content:"\203a";color:var(--g2);font-size:14.4px;font-weight:700;line-height:1;
  display:inline-block;width:8px}
.rtog[aria-expanded="true"]::before{content:"\2304";font-size:12.0px}
.rlead{display:inline-flex;align-items:center;gap:6px}

/* ───── YTD target vs achieved ───── */
.ytd{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:#fff;
  flex:0 0 auto}
.ytd>div{padding:6px 12px;border-right:1px solid var(--line)}
.ytd>div:last-child{border-right:none}
.ytdh{font-size:11.4px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g2)}
.ytdr{display:flex;align-items:baseline;gap:14px;margin-top:2px}
.ytdr b{font-size:18.0px}
.ytdr span{font-size:12.0px;color:var(--g2)}
.ytdbar{height:7px;background:var(--g5);margin-top:5px;position:relative}
.ytdbar i{display:block;height:7px;background:var(--g2)}
.ytdbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
/* ───── milestone passed / not passed ───── */
.pillar.done::after{background:var(--grn)}
.mslabs span.done{color:var(--grn)}
/* ───── remarks: chevron only ───── */
.rtog{gap:0;width:14px;justify-content:center}
.mcell{vertical-align:middle;background:#FAFAFA}

/* ───── horizontal progress bar: filled / shortfall / remainder, with a target marker ───── */
.hpwrap{margin-bottom:14px}
.hphd{display:flex;justify-content:space-between;font-size:12.0px;color:var(--g2);margin-bottom:3px}
.hphd b{font-size:13.2px;color:var(--ink)}

<script>
/* ════ SMM wireframe — built from the live deck. Placeholders only. ════ */
const X='XX', XY='Xx', XP='XX%', RS='Rs XX Cr';
const $=s=>document.querySelector(s);

const STAGES=[['Pre-launch','approvals, pricing, not yet on sale'],
              ['Active sales','open for booking'],
              ['Handover','possession offered and taken']];
const MILE=['LAUNCH','POSSESSION / OC'];
const PROJECTS=[
 {id:'p1',name:'Project name',city:'Chennai',biz:'Residential',kind:'bts',cur:2,alert:1,rem:1},
 {id:'p2',name:'Project name',city:'Chennai',biz:'Residential',kind:'bts',cur:1,alert:0,rem:0},
 {id:'p3',name:'Project name',city:'Chennai',biz:'Commercial',kind:'btl',cur:1,alert:1,rem:0}
];

function ribbon(bands){
  return `<div class="rib c${bands.length}">`+bands.map(([t,boxes])=>
    `<div class="band"><div class="bh">${t}</div><div class="bb">`+
    boxes.map(([l,v,s])=>`<div class="bx"><span class="bl">${l}</span>
      <span class="bv">${v}</span><span class="cmp">${s||'&nbsp;'}</span></div>`).join('')+
    `</div></div>`).join('')+`</div>`;
}
let CCID=0;
function cardCollapse(title,note,body,open){
  const id='cc'+(++CCID);
  return `<div class="card"><div class="ct">
      <button class="cbtn" data-cc="${id}" aria-expanded="${!!open}">${title}</button>
      ${note?`<span class="cn">${note}</span>`:''}</div>
    <div class="cbody" id="${id}"${open?'':' hidden'}>${body}</div></div>`;
}
function wireCollapse(scope){
  let cHit=0, cId='';
  (scope||document).querySelectorAll('[data-cc]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.cc, now=Date.now();
    if(id===cId && now-cHit<350){ cHit=now; return; }   /* double-click = one toggle */
    cHit=now; cId=id;
    const t=document.getElementById(id), open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',!open); t.hidden=open; fitView();
  }));
}
function card(title,note,body,extra){
  return `<div class="card"><div class="ct"><h2>${title}</h2>
    ${extra||(note?`<span class="cn">${note}</span>`:'')}</div>${body}</div>`;
}
function tbl(cols,head,rows,foot,cls){
  return `<table class="${cls||''}"><thead><tr>`+head.map((h,i)=>
      `<th class="${cols[i]||''}">${h}</th>`).join('')+`</tr></thead><tbody>`+
    rows.map(r=>`<tr>`+r.map((c,i)=>`<td class="${cols[i]||''}">${c}</td>`).join('')+`</tr>`).join('')+
    `</tbody>`+(foot?`<tfoot><tr>`+foot.map((c,i)=>`<td class="${cols[i]||''}">${c}</td>`).join('')+`</tr></tfoot>`:'')+
    `</table>`;
}
let RID=0;
function mountTip(){
  if(document.getElementById('tip')) return;
  const t=document.createElement('div'); t.id='tip'; document.body.appendChild(t);
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]');
    if(!el){t.classList.remove('on');return;}
    t.textContent=el.dataset.tip; t.classList.add('on');
  });
  document.addEventListener('mousemove',e=>{
    if(!t.classList.contains('on')) return;
    t.style.left=Math.min(e.clientX+12,window.innerWidth-t.offsetWidth-8)+'px';
    t.style.top=Math.max(e.clientY-30,4)+'px';
  });
}
const tip=s=>` data-tip="${s}"`;
function sel(items,name,active){
  return `<span class="selw"><select class="sel" data-${name}>`+
    items.map((t,i)=>`<option value="${i}"${i===(active||0)?' selected':''}>${t}</option>`).join('')+
    `</select></span>`;
}
/* a row-level remark: arrow toggles the body beneath */
let RKID=0;
function remLeadInline(label){
  RKID++;
  return `<button class="rtog" data-rk="rkin${RKID}" aria-expanded="false"
      title="Remarks" aria-label="Remarks"></button><span class="pn">${label}</span>`;
}
function remBody(txt){
  return `<div class="rbody" id="rkin${RKID}" hidden>${txt||'one line from the project owner'}</div>`;
}
function remark(txt){
  const id='rk'+(++RID);
  return `<button class="rtog" data-rk="${id}" aria-expanded="false" title="Remarks"
      aria-label="Remarks"></button>
    <div class="rbody" id="${id}" hidden>${txt||'remark text'}</div>`;
}
/* a chevron that sits to the LEFT of a row label and reveals a remark row */
function remLead(label,cols,txt){
  const id='rl'+(++RID);
  return {lead:`<span class="rlead"><button class="rtog" data-rk="${id}" aria-expanded="false"
              title="Remarks" aria-label="Remarks"></button>
            <span class="pn">${label}</span></span>`,
          row:`<tr class="remrow" id="${id}" hidden><td colspan="${cols}">${txt||'remark text'}</td></tr>`};
}
function remarkRow(cols,txt){
  const id='rr'+(++RID);
  return {tog:`<button class="rtog" data-rk="${id}" aria-expanded="false"
              title="Remarks" aria-label="Remarks"></button>`,
          row:`<tr class="remrow" id="${id}" hidden><td colspan="${cols}">${txt||'remark text'}</td></tr>`};
}
function wireRemarks(scope){
  (scope||document).querySelectorAll('[data-rk]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const t=document.getElementById(b.dataset.rk), open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',!open);
    if(t.tagName==='TR') t.hidden=open; else t.hidden=open;
  }));
}
function btns(items,active,name){
  return `<span class="btnr">`+items.map((t,i)=>
    `<button class="btn" data-${name}="${i}" aria-pressed="${i===active}">${t}</button>`).join('')+`</span>`;
}
/* four-bar column chart, value above each bar */
function cols4(unit,items,h,mxo){
  const H=h||118, mx=mxo||Math.max(...items.map(i=>i.h));
  return `<div class="bars" style="height:${H}px">`+items.map(i=>{
    const px=Math.max(i.h/mx*(H-26),4);
    return `<div class="bcol"><div class="bwr">
        <span class="bvv" style="bottom:${px+3}px;top:auto">${i.v||X}</span>
        <div class="bar ${i.cls||''}" style="height:${px}px"${tip(i.k+': '+(i.v||X))}></div></div>
      <div class="blb">${i.k}</div></div>`;}).join('')+
    `</div>${unit?`<div class="unit">${unit}</div>`:''}`;
}
/* one horizontal bar: filled, shortfall to target in red, remainder light */
function hprog(o){
  const f=o.fill, t=o.target, sf=Math.max(0,t-f);
  if(o.nc) return `<div class="hpwrap">
    <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
    <div class="hp"><span class="hpnc">not captured</span></div>
    <div class="hplab"><span>${o.n1} <span class="na">n/c</span></span>
      <span>${o.n4} <span class="na">n/c</span></span>
      <span>${o.n5} <span class="na">n/c</span></span></div></div>`;
  const mid=o.mid;
  const body = (mid!==undefined)
    ? `<i class="f1" style="left:0;width:${f}%"${tip(o.n1+': '+X)}></i>
       <i class="f3" style="left:${f}%;width:${mid-f}%"${tip(o.nMid+': '+X)}></i>
       <i style="left:${mid}%;width:${100-mid}%;background:var(--g5)"${tip(o.n3+': '+X)}></i>`
    : `<i class="f1" style="left:0;width:${f}%"${tip(o.n1+': '+X)}></i>
       ${sf>0?`<i class="f2" style="left:${f}%;width:${sf}%"${tip(o.n2+': '+X)}></i>`:''}
       <i style="left:${t}%;width:${100-t}%;background:var(--g5)"${tip(o.n3+': '+X)}></i>`;
  const midLab = (mid!==undefined) ? `<span>${o.nMid} <b>${X}</b></span>`
                                   : `<span>${o.n2} <b>${X}</b></span>`;
  if(o.mapKeys3){
    const [L1,L2,L3,L4]=o.mapKeys3, mid=o.mid;
    return `<div class="hpwrap">
      <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
      <div class="hpmk"><span class="pinlab" style="left:${t}%">${L3} <b>${X}</b></span></div>
      <div class="hp">
        <i class="f1" style="left:0;width:${f}%"${tip(L1+': '+X)}></i>
        <i class="f3" style="left:${f}%;width:${mid-f}%"${tip(L2+': '+X)}></i>
        <i style="left:${mid}%;width:${100-mid}%;background:var(--g5)"${tip('Unsold, no prospect: '+X)}></i>
        <span class="mk" style="left:${t}%"></span></div>
      <div class="hplabmap">
        <span class="pinlab" style="left:${f/2}%">${L1} <b>${X}</b></span>
        <span class="pinlab" style="left:${f+(mid-f)/2}%">${L2} <b>${X}</b></span>
        <span class="pinlab end" style="left:100%">${L4} <b>${X}</b></span></div></div>`;
  }
  if(o.mapKeys){
    const [L1,L2,L3,L4]=o.mapKeys;
    const soldC=f/2; let shortC=f+sf/2;
    if(sf>0 && shortC-soldC<14) shortC=soldC+14;
    return `<div class="hpwrap">
      <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
      <div class="hpmk"><span class="pinlab" style="left:${t}%">${L3} <b>${X}</b></span></div>
      <div class="hp">
        <i class="f1" style="left:0;width:${f}%"${tip(L1+': '+X)}></i>
        ${sf>0?`<i class="f2" style="left:${f}%;width:${sf}%"${tip(L2+': '+X)}></i>`:''}
        <i style="left:${t}%;width:${100-t}%;background:var(--g5)"${tip('Not yet demanded: '+X)}></i>
        <span class="mk" style="left:${t}%"></span></div>
      <div class="hplabmap">
        <span class="pinlab" style="left:${soldC}%">${L1} <b>${X}</b></span>
        ${sf>0?`<span class="pinlab" style="left:${shortC}%">${L2} <b>${X}</b></span>`:''}
        <span class="pinlab end" style="left:100%">${L4} <b>${X}</b></span></div></div>`;
  }
  if(o.keys){
    /* each label sits under the segment it actually describes */
    const soldC   = f/2;                                  /* centre of the dark fill   */
    let  shortC   = f + sf/2;                             /* centre of the red band    */
    if(sf>0 && shortC-soldC < 14) shortC = soldC + 14;    /* keep them apart if narrow */
    const clickable=
      `<i class="f1" style="left:0;width:${f}%" data-metric="sold" data-row="${o.label}"
         ${tip('Sold: '+X)}></i>
       ${sf>0?`<i class="f2" style="left:${f}%;width:${sf}%" data-metric="shortfall" data-row="${o.label}"
         ${tip('Shortfall: '+X)}></i>`:''}
       <i style="left:${t}%;width:${100-t}%;background:var(--g5)" data-metric="total" data-row="${o.label}"
         ${tip('Not in this period\u2019s target: '+X)}></i>`;
    return `<div class="hpwrap">
      <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
      <div class="hpmk">
        <button class="mlink pin" data-metric="tosell" data-row="${o.label}"
          style="left:${t}%">To sell <b>${X}</b></button></div>
      <div class="hp hpclick">${clickable}
        <span class="mk" style="left:${t}%"></span></div>
      <div class="hplabmap">
        <button class="mlink pin" data-metric="sold" data-row="${o.label}"
          style="left:${soldC}%">Sold <b>${X}</b></button>
        ${sf>0?`<button class="mlink pin" data-metric="shortfall" data-row="${o.label}"
          style="left:${shortC}%">Shortfall <b>${X}</b></button>`:''}
        <button class="mlink pin end" data-metric="total" data-row="${o.label}"
          style="left:100%">Total units <b>${X}</b></button></div></div>`;
  }
  return `<div class="hpwrap">
    <div class="hphd"><b>${o.label}</b><span>${o.unit||''}</span></div>
    <div class="hp">${body}
      <span class="mk" style="left:${t}%"></span>
      <span class="mklab" style="left:${t}%">${o.n4} ${X}</span>

            level: RSCOPE>0?'config':'projects', project: RSCOPE>0?RSCOPE-1:null};
    rResi();}));
  document.querySelectorAll('[data-proj]').forEach(r=>r.addEventListener('click',()=>{
    RDRILL={...RDRILL, level:'config', project:+r.dataset.proj}; rResi();}));
  const bb=$('[data-back]'); if(bb) bb.addEventListener('click',()=>{
    if(RDRILL.level==='config' && RSCOPE===0) RDRILL={...RDRILL,level:'projects',project:null};
    else RDRILL=null;
    rResi();});
}

function mountFilters(){
  const bar=document.getElementById('fbar');
  bar.innerHTML=`<label for="f-asset">Asset type</label>
    ${sel(['All','Residential','Commercial'],'fasset',0).replace('<select','<select id="f-asset"')}
    <label for="f-region">Region</label>
    ${sel(['All','Chennai','Kolkata'],'fregion',0).replace('<select','<select id="f-region"')}
    <label for="f-view">View</label>
    ${sel(['Overall'].concat(PROJNAMES),'fview',GVIEW).replace('<select','<select id="f-view"')}`;
  const fv=bar.querySelector('#f-view');
  if(fv) fv.addEventListener('change',()=>{GVIEW=+fv.value; RSCOPE=GVIEW; RDRILL=null;});
  bar.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{
    Object.keys(DONE).forEach(k=>delete DONE[k]);
    const cur=[...document.querySelectorAll('.tab')].find(t=>t.getAttribute('aria-selected')==='true');
    show(cur?cur.dataset.v:'ov');
  }));
}

/* ══════════ tabs ══════════ */
const R={ov:rOverview,mkt:rMkt,sal:rSales,crm:rCRM,act:rAct}, DONE={};
/* scale the rendered view so it always fits the viewport - no page scroll, no clipping */
function fitView(){
  document.querySelectorAll('.view').forEach(v=>{
    if(v.hidden) return;
    let f=v.querySelector(':scope > .fit');
    if(!f){ f=document.createElement('div'); f.className='fit';
      while(v.firstChild) f.appendChild(v.firstChild); v.appendChild(f); }
    f.style.transform='none'; f.style.width='100%';
    const avail=v.clientHeight, nat=f.scrollHeight;
    /* only nudge for a small overflow; a big one (zoomed in) is left to scroll */
    if(nat>avail && nat>0 && avail/nat>=0.85){
      const s=avail/nat;
      f.style.transform=`scale(${s})`; f.style.width=(100/s)+'%';
    }
  });
}
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.hidden=(x.id!=='v-'+v));
  if(!DONE[v]){R[v]();DONE[v]=true;}
  requestAnimationFrame(fitView);
}
window.addEventListener('resize',()=>requestAnimationFrame(fitView));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
mountFilters();
mountTip();
show('act');
